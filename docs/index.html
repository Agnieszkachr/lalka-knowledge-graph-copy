        /* ==================================================
           Base
           ================================================== */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f8f6f2;
            font-family: Arial, sans-serif;
        }

        #mynetwork {
            width: 100%;
            height: 100vh;
            
        background-color: #f8f6f2 !important;
    
        }


        /* ==================================================
           Header
           ================================================== */

        .graph-header {
            position: fixed;
            top: 20px;
            left: 24px;
            z-index: 1000;
            pointer-events: none;

            background:
                rgba(
                    248,
                    246,
                    242,
                    0.90
                );

            padding: 12px 16px;
            border-radius: 8px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.08);
        }

        .graph-header-title {
            font-size: 20px;
            font-weight: 600;
            color: #50504f;
            margin-bottom: 3px;
        }

        .graph-header-subtitle {
            font-size: 12px;
            color: #77736e;
        }

        .view-controls {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px;
            border-radius: 10px;
            background: rgba(248, 246, 242, 0.96);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.10);
        }

        .view-controls button {
            border: 1px solid #d2cbc1;
            border-radius: 7px;
            background: transparent;
            color: #50504f;
            padding: 7px 11px;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .view-controls button.active {
            color: #fff;
            border-color: #3478a8;
            background: #3478a8;
        }

        .edition-grouping {
            display: none;
            align-items: center;
            gap: 6px;
            margin-left: 4px;
            padding-left: 10px;
            border-left: 1px solid #d2cbc1;
        }

        .edition-grouping.visible {
            display: flex;
        }


        /* ==================================================
           PBL logo
           ================================================== */

        .pbl-logo {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 1000;
            pointer-events: none;

            background:
                rgba(
                    248,
                    246,
                    242,
                    0.90
                );

            padding: 8px 12px;
            border-radius: 8px;
        }

        .pbl-logo img {
            display: block;
            max-width: 180px;
            max-height: 55px;
        }


        /* ==================================================
           Legend
           ================================================== */

        .legend {
            position: fixed;
            bottom: 22px;
            left: 24px;
            z-index: 1000;

            background:
                rgba(
                    248,
                    246,
                    242,
                    0.94
                );

            padding: 12px 15px;
            border-radius: 8px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.08);

            font-size: 12px;
            color: #50504f;
        }

        .legend-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .legend-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
        }


        /* ==================================================
           Details panel
           ================================================== */

        .details-panel {
            position: fixed;
            top: 90px;
            right: 24px;
            z-index: 1001;

            width: 380px;
            max-height: calc(100vh - 130px);

            overflow-y: auto;

            background:
                rgba(
                    248,
                    246,
                    242,
                    0.97
                );

            border-radius: 10px;

            box-shadow:
                0 4px 22px
                rgba(0, 0, 0, 0.13);

            padding: 18px;
            box-sizing: border-box;

            display: none;
        }

        .details-panel.visible {
            display: block;
        }

        .details-type {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #87745e;
            margin-bottom: 7px;
        }

        .details-title {
            font-size: 19px;
            line-height: 1.35;
            font-weight: 600;
            color: #50504f;
            margin-bottom: 15px;
        }

        .details-row {
            display: flex;
            gap: 10px;
            margin: 7px 0;
            font-size: 13px;
            line-height: 1.4;
        }

        .details-key {
            width: 105px;
            flex-shrink: 0;
            color: #77736e;
        }

        .details-value {
            color: #50504f;
            word-break: break-word;
        }

        .details-description {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #ded9d1;
            font-size: 13px;
            line-height: 1.5;
            color: #50504f;
        }


        /* ==================================================
           Interaction hint
           ================================================== */

        .interaction-hint {
            position: fixed;
            bottom: 22px;
            right: 24px;
            z-index: 1000;

            background:
                rgba(
                    248,
                    246,
                    242,
                    0.90
                );

            padding: 8px 12px;
            border-radius: 7px;

            font-size: 11px;
            color: #77736e;

            pointer-events: none;
        }


        /* ==================================================
           Mobile / small screens
           ================================================== */

        @media (max-width: 700px) {

            .graph-header {
                top: 10px;
                left: 10px;
            }

            .graph-header-title {
                font-size: 16px;
            }

            .view-controls {
                top: 68px;
                max-width: calc(100vw - 20px);
                white-space: nowrap;
            }

            .pbl-logo {
                top: 10px;
                right: 10px;
            }

            .pbl-logo img {
                max-width: 120px;
                max-height: 40px;
            }

            .details-panel {
                top: 70px;
                right: 10px;
                left: 10px;
                width: auto;
                max-height: 45vh;
            }

            .legend {
                bottom: 10px;
                left: 10px;
            }

            .interaction-hint {
                display: none;
            }
        }

 {"id": "source:1422", "type": "Source", "title": "Gazeta Wyborcza", "metadata": {"PBL ID": 1422}, "description": ""}, "author:2557": {"id": "author:2557", "type": "Person", "title": "Hanna Gosk", "metadata": {"PBL ID": 2557}, "description": ""}, "source:716": {"id": "source:716", "type": "Source", "title": "Nowe Książki", "metadata": {"PBL ID": 716}, "description": ""}, "author:605691": {"id": "author:605691", "type": "Person", "title": "Joanna Krenz", "metadata": {"PBL ID": 605691}, "description": ""}, "source:20077": {"id": "source:20077", "type": "Source", "title": "Wiek XIX", "metadata": {"PBL ID": 20077}, "description": ""}, "author:691951": {"id": "author:691951", "type": "Person", "title": "Author 691951", "metadata": {"PBL ID": 691951}, "description": ""}, "author:28011": {"id": "author:28011", "type": "Person", "title": "Henryk Markiewicz", "metadata": {"PBL ID": 28011}, "description": ""}, "source:2336": {"id": "source:2336", "type": "Source", "title": "Dekada Literacka", "metadata": {"PBL ID": 2336}, "description": ""}};

        let currentView = "all";
        let currentEditionGrouping = "chronology";

        function setActiveButton(id, active) {
            document.getElementById(id).classList.toggle("active", active);
        }

        function ensureYearMarkers(years) {
            const existingIds = new Set(network.body.data.nodes.getIds());
            years.forEach(year => {
                const id = `timeline:${year}`;
                if (!existingIds.has(id)) {
                    network.body.data.nodes.add({
                        id: id,
                        label: String(year),
                        nodeType: "TimelineMarker",
                        shape: "box",
                        color: {background: "#efe8dd", border: "#c3b7a7"},
                        font: {face: "Arial", size: 18, color: "#50504f", bold: true},
                        margin: 10,
                        hidden: true,
                        physics: false,
                        fixed: true
                    });
                }
            });
        }

        function showAllGraph() {
            currentView = "all";
            setActiveButton("view-all", true);
            setActiveButton("view-editions", false);
            document.getElementById("edition-grouping").classList.remove("visible");

            network.body.data.nodes.update(network.body.data.nodes.get().map(node => ({
                id: node.id,
                hidden: node.nodeType === "TimelineMarker",
                fixed: false,
                physics: node.nodeType !== "TimelineMarker"
            })));
            network.body.data.edges.update(network.body.data.edges.get().map(edge => ({
                id: edge.id,
                hidden: false
            })));
            network.setOptions({physics: {enabled: true}});
            network.fit({animation: {duration: 500}});
        }

        function showEditions(grouping) {
            currentView = "editions";
            currentEditionGrouping = grouping;
            setActiveButton("view-all", false);
            setActiveButton("view-editions", true);
            setActiveButton("group-chronology", grouping === "chronology");
            setActiveButton("group-publishers", grouping === "publishers");
            document.getElementById("edition-grouping").classList.add("visible");

            const allNodes = network.body.data.nodes.get();
            const editions = allNodes
                .filter(node => node.nodeType === "Edition")
                .sort((a, b) => (a.publicationYear - b.publicationYear) || String(a.id).localeCompare(String(b.id)));
            const editionIds = new Set(editions.map(node => node.id));
            // Show every year of the covered range, including years
            // without editions, so that gaps remain visible.
            const editionYears = editions.map(node => node.publicationYear).filter(year => year !== null);
            const years = [];
            for (let year = Math.min(...editionYears); year <= Math.max(...editionYears); year++) {
                years.push(year);
            }
            ensureYearMarkers(years);

            if (grouping === "chronology") {
                const byYear = {};
                editions.forEach(node => (byYear[node.publicationYear] ||= []).push(node));
                const updates = network.body.data.nodes.get().map(node => ({
                    id: node.id,
                    hidden: node.nodeType !== "Edition" && node.nodeType !== "TimelineMarker" && node.id !== "record:109715",
                    fixed: true,
                    physics: false
                }));

                updates.push({id: "record:109715", x: 0, y: -700, hidden: false});
                years.forEach((year, yearIndex) => {
                    const column = yearIndex % 7;
                    const row = Math.floor(yearIndex / 7);
                    const x = -870 + column * 290;
                    const y = -430 + row * 470;
                    updates.push({id: `timeline:${year}`, x: x, y: y, hidden: false});
                    (byYear[year] || []).forEach((edition, index) => {
                        updates.push({id: edition.id, x: x, y: y + 90 + index * 72, hidden: false});
                    });
                });
                network.body.data.nodes.update(updates);
                network.body.data.edges.update(network.body.data.edges.get().map(edge => ({id: edge.id, hidden: true})));
                network.setOptions({physics: {enabled: false}});
            } else {
                const editionPublisherIds = new Set();
                network.body.data.edges.get().forEach(edge => {
                    if (edge.relationship === "PUBLISHED_BY" && editionIds.has(edge.from)) {
                        editionPublisherIds.add(edge.to);
                    }
                });
                const visibleIds = new Set(["record:109715", ...editionIds, ...editionPublisherIds]);
                network.body.data.nodes.update(network.body.data.nodes.get().map(node => ({
                    id: node.id,
                    hidden: !visibleIds.has(node.id),
                    fixed: false,
                    physics: visibleIds.has(node.id)
                })));
                network.body.data.edges.update(network.body.data.edges.get().map(edge => ({
                    id: edge.id,
                    hidden: !(visibleIds.has(edge.from) && visibleIds.has(edge.to) &&
                        (edge.relationship === "HAS_EDITION" || edge.relationship === "PUBLISHED_BY"))
                })));
                network.setOptions({physics: {enabled: true}});
            }

            document.getElementById("details-panel").classList.remove("visible");
            setTimeout(() => network.fit({animation: {duration: 500}}), 100);
        }

        document.getElementById("view-all").addEventListener("click", showAllGraph);
        document.getElementById("view-editions").addEventListener("click", () => showEditions(currentEditionGrouping));
        document.getElementById("group-chronology").addEventListener("click", () => showEditions("chronology"));
        document.getElementById("group-publishers").addEventListener("click", () => showEditions("publishers"));


        // ==================================================
        // HTML escaping
        // ==================================================

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        // ==================================================
        // Type labels
        // ==================================================

        function getTypeLabel(type) {

            const labels = {
                "Work": "Utwór",
                "Adaptation": "Adaptacja",
                "Edition": "Wydanie",
                "Person": "Osoba",
                "Publication": "Publikacja",
                "RelatedRecord": "Rekord powiązany",
                "Source": "Źródło",
                "Publisher": "Wydawca"
            };

            return labels[type] || type || "";
        }


        // ==================================================
        // Details HTML
        // ==================================================

        function buildDetailsHtml(data) {

            if (!data) {
                return "";
            }

            let result = "";


            result += `
                <div class="details-type">
                    ${escapeHtml(
                        getTypeLabel(data.type)
                    )}
                </div>
            `;


            result += `
                <div class="details-title">
                    ${escapeHtml(data.title)}
                </div>
            `;


            if (data.metadata) {

                for (
                    const [key, value]
                    of Object.entries(data.metadata)
                ) {

                    if (
                        value === null ||
                        value === undefined ||
                        value === ""
                    ) {
                        continue;
                    }

                    result += `
                        <div class="details-row">

                            <div class="details-key">
                                ${escapeHtml(key)}
                            </div>

                            <div class="details-value">
                                ${escapeHtml(value)}
                            </div>

                        </div>
                    `;
                }
            }


            if (data.description) {

                result += `
                    <div class="details-description">
                        ${escapeHtml(
                            data.description
                        )}
                    </div>
                `;
            }


            return result;
        }


        // ==================================================
        // Original edge color
        // ==================================================

        function getOriginalEdgeColor(edge) {

            if (edge.originalColor) {

                return {
                    color: edge.originalColor,
                    opacity: 1
                };
            }


            if (
                edge.color &&
                typeof edge.color === "object" &&
                edge.color.color
            ) {

                return {
                    color: edge.color.color,
                    opacity: 1
                };
            }


            if (
                edge.color &&
                typeof edge.color === "string"
            ) {

                return {
                    color: edge.color,
                    opacity: 1
                };
            }


            return {
                color: "#b9b3aa",
                opacity: 1
            };
        }


        // ==================================================
        // Original node color
        // ==================================================

        function getOriginalNodeColor(node) {

            if (node.originalColor) {
                return node.originalColor;
            }

            if (node.color) {
                return node.color;
            }

            return {
                background: "#999999",
                border: "#999999"
            };
        }


        // ==================================================
        // Reset graph
        // ==================================================

        function resetGraph() {

            // ----------------------------------------------
            // Restore node colors
            // ----------------------------------------------

            const nodeUpdates = [];

            network.body.data.nodes
                .get()
                .forEach(node => {

                    nodeUpdates.push({
                        id: node.id,
                        color:
                            getOriginalNodeColor(node)
                    });
                });


            network.body.data.nodes.update(
                nodeUpdates
            );


            // ----------------------------------------------
            // Restore edge colors and widths
            // ----------------------------------------------

            const edgeUpdates = [];

            network.body.data.edges
                .get()
                .forEach(edge => {

                    const originalColor =
                        getOriginalEdgeColor(edge);

                    edgeUpdates.push({
                        id: edge.id,

                        color: originalColor,

                        width:
                            edge.originalWidth ||
                            1.0
                    });
                });


            network.body.data.edges.update(
                edgeUpdates
            );
        }


        // ==================================================
        // Highlight selected node
        // ==================================================

        function highlightNode(nodeId) {

            const connectedNodes =
                new Set(
                    network.getConnectedNodes(
                        nodeId
                    )
                );

            connectedNodes.add(nodeId);


            // ----------------------------------------------
            // Nodes
            // ----------------------------------------------

            const nodeUpdates = [];

            network.body.data.nodes
                .get()
                .forEach(node => {

                    const connected =
                        connectedNodes.has(
                            node.id
                        );


                    const originalColor =
                        getOriginalNodeColor(node);


                    if (connected) {

                        nodeUpdates.push({
                            id: node.id,

                            color: originalColor
                        });

                    } else {

                        nodeUpdates.push({
                            id: node.id,

                            color: {
                                background:
                                    "#d7d4cf",

                                border:
                                    "#d0ccc6",

                                highlight: {
                                    background:
                                        "#d7d4cf",

                                    border:
                                        "#aaa59d"
                                },

                                hover: {
                                    background:
                                        "#d7d4cf",

                                    border:
                                        "#aaa59d"
                                }
                            }
                        });
                    }
                });


            network.body.data.nodes.update(
                nodeUpdates
            );


            // ----------------------------------------------
            // Edges
            // ----------------------------------------------

            const connectedEdges =
                new Set(
                    network.getConnectedEdges(
                        nodeId
                    )
                );


            const edgeUpdates = [];

            network.body.data.edges
                .get()
                .forEach(edge => {

                    const connected =
                        connectedEdges.has(
                            edge.id
                        );


                    const originalWidth =
                        edge.originalWidth ||
                        1.0;


                    if (connected) {

                        edgeUpdates.push({
                            id: edge.id,

                            color: {
                                color: "#50504f",
                                opacity: 1
                            },

                            width:
                                Math.max(
                                    originalWidth,
                                    2
                                )
                        });

                    } else {

                        edgeUpdates.push({
                            id: edge.id,

                            color: {
                                color: "#d8d3cb",
                                opacity: 0.20
                            },

                            width:
                                originalWidth
                        });
                    }
                });


            network.body.data.edges.update(
                edgeUpdates
            );
        }


        // ==================================================
        // Details panel
        // ==================================================

        function showDetails(nodeId) {

            const panel =
                document.getElementById(
                    "details-panel"
                );


            const data =
                detailsData[nodeId];


            if (!data) {

                panel.classList.remove(
                    "visible"
                );

                return;
            }


            panel.innerHTML =
                buildDetailsHtml(data);


            panel.classList.add(
                "visible"
            );
        }


        // ==================================================
        // Click
        // ==================================================

        network.on(
            "click",
            function(params) {

                // ------------------------------------------
                // Clicked a node
                // ------------------------------------------

                if (
                    params.nodes &&
                    params.nodes.length > 0
                ) {

                    const nodeId =
                        params.nodes[0];


                    // Stop the graph immediately.
                    network.setOptions({
                        physics: {
                            enabled: false
                        }
                    });


                    // Highlight selected node and
                    // its directly connected neighbourhood.
                    highlightNode(
                        nodeId
                    );


                    // Show metadata panel.
                    showDetails(
                        nodeId
                    );


                } else {

                    // --------------------------------------
                    // Clicked empty space
                    // --------------------------------------

                    resetGraph();


                    document
                        .getElementById(
                            "details-panel"
                        )
                        .classList.remove(
                            "visible"
                        );


                    // Start physics again.
                    network.setOptions({
                        physics: {
                            enabled:
                                currentView === "all" ||
                                currentEditionGrouping === "publishers"
                        }
                    });
                }
            }
        );


        // ==================================================
        // Double click
        // ==================================================

        network.on(
            "doubleClick",
            function(params) {

                if (
                    params.nodes &&
                    params.nodes.length > 0
                ) {

                    // Keep the graph stopped while focusing.
                    network.setOptions({
                        physics: {
                            enabled: false
                        }
                    });


                    network.focus(
                        params.nodes[0],
                        {
                            scale: 1.3,

                            animation: {
                                duration: 500,
                                easingFunction:
                                    "easeInOutQuad"
                            }
                        }
                    );
                }
            }
        );

    </script>
